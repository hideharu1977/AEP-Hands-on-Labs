			shellScript = "# Compile all doomgeneric C source files into a static library.\n# This runs before the Swift/Metal compile phase.\n\nset -e\n\nDOOM_SRC=\"${SRCROOT}/DoomIOS/doomgeneric\"\nOUT_LIB=\"${BUILT_PRODUCTS_DIR}/libdoomgeneric.a\"\nOBJ_DIR=\"${DERIVED_FILE_DIR}/doomgeneric_objs\"\n\nif [ ! -d \"${DOOM_SRC}\" ]; then\n  echo \"error: doomgeneric sources not found at ${DOOM_SRC}\"\n  echo \"error: Run ios-doom/setup.sh first to fetch the engine sources.\"\n  exit 1\nfi\n\nmkdir -p \"${OBJ_DIR}\"\n\n# Compiler flags matching what Doom expects\nCFLAGS=\"-DNORMALUNIX -DLINUX -O2 -arch ${ARCHS}\\\n  -isysroot ${SDKROOT}\\\n  -miphoneos-version-min=${IPHONEOS_DEPLOYMENT_TARGET}\\\n  -I${DOOM_SRC}\\\n  -Wno-deprecated-declarations -Wno-unused-result\\\n  -Wno-implicit-function-declaration -Wno-int-conversion\"\n\n# Compile each .c file in the doomgeneric directory\nOBJ_FILES=\"\"\nfor SRC in \"${DOOM_SRC}\"/*.c; do\n  BASENAME=$(basename \"${SRC}\" .c)\n  OBJ=\"${OBJ_DIR}/${BASENAME}.o\"\n  xcrun clang ${CFLAGS} -c \"${SRC}\" -o \"${OBJ}\"\n  OBJ_FILES=\"${OBJ_FILES} ${OBJ}\"\ndone\n\n# Create static library\nxcrun ar rcs \"${OUT_LIB}\" ${OBJ_FILES}\n\necho \"doomgeneric engine compiled: ${OUT_LIB}\"\n";
		};
